<!doctype html><html><head><meta charset="utf-8"><title>01 composition</title>
<style>
:root{--ink:#17181A;--paper:#F3EEE3;--line:rgba(23,24,26,.07);--yellow:#FFD43B;--muted:#6C6A63}
*{box-sizing:border-box;margin:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:var(--paper);font-family:"Source Han Sans","PingFang SC",sans-serif;color:var(--ink)}
#bg{position:absolute;inset:0;background:var(--paper);background-image:linear-gradient(var(--line) 2px,transparent 2px),linear-gradient(90deg,var(--line) 2px,transparent 2px);background-size:60px 60px}
#person{position:absolute;overflow:hidden;z-index:3;background:#222}
#person img{position:absolute;display:block;max-width:none}
.scene{position:absolute;inset:0;visibility:hidden;z-index:2}
.scene.top{z-index:4}
#chapter{position:absolute;left:44px;top:128px;z-index:6;background:var(--ink);color:var(--yellow);font-weight:800;font-size:38px;padding:8px 26px;border-radius:999px;letter-spacing:1px}
#sub{position:absolute;left:30px;right:30px;top:1568px;text-align:center;z-index:7;font-weight:800;font-size:60px;line-height:1.2;color:#fff;text-shadow:0 0 3px #000,0 3px 0 #000,3px 0 0 #000,-3px 0 0 #000,0 -3px 0 #000,3px 3px 0 #000,-3px 3px 0 #000,3px -3px 0 #000,-3px -3px 0 #000,0 8px 18px rgba(0,0,0,.45)}
#sub.long{font-size:52px}
#sub b{color:var(--ink);background:var(--yellow);padding:0 12px;border-radius:10px;text-shadow:none;font-weight:900;margin:0 3px}
.big{font-family:"Smiley Sans","Source Han Sans";font-weight:400;line-height:1.05}
.abs{position:absolute}
.hero{position:absolute;left:40px;right:40px;top:210px;text-align:center;font-size:150px;color:#fff;text-shadow:0 6px 0 rgba(0,0,0,.85),0 0 30px rgba(0,0,0,.55)}
.hero em{font-style:normal;color:var(--yellow)}
.chip{position:absolute;background:var(--yellow);color:var(--ink);font-weight:900;font-size:60px;padding:12px 34px;border-radius:18px;border:5px solid var(--ink);box-shadow:8px 8px 0 var(--ink)}
.row{position:absolute;left:60px;width:960px;display:flex;align-items:center;gap:34px;background:#fff;border:5px solid var(--ink);border-radius:26px;box-shadow:10px 10px 0 var(--ink);padding:26px 40px;font-size:82px;font-weight:900}
.row i{font-style:normal;font-family:"Smiley Sans";background:var(--yellow);border:5px solid var(--ink);width:104px;height:104px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:66px;flex:none}
.card{position:absolute;left:48px;width:984px;background:#fff;border:5px solid var(--ink);border-radius:30px;overflow:hidden;box-shadow:10px 10px 0 var(--ink)}
.bar{height:62px;background:var(--ink);color:#fff;display:flex;align-items:center;padding:0 28px;font-size:30px;font-weight:700;gap:18px}
.bar span{color:var(--yellow)}
.tag{position:absolute;font-size:30px;color:var(--muted);font-weight:700}
.grid{position:absolute;left:48px;width:984px;display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
.grid img{width:100%;aspect-ratio:9/15;object-fit:cover;border-radius:14px;border:4px solid var(--ink);display:block}
.mega{position:absolute;left:0;right:0;text-align:center;font-size:190px;color:var(--ink);text-shadow:0 0 34px #F3EEE3,0 0 34px #F3EEE3,0 0 60px #F3EEE3}
.mega em{font-style:normal;background:var(--yellow);padding:0 26px;border-radius:24px;border:6px solid var(--ink);text-shadow:none}
.quote{padding:44px 44px 38px;font-size:52px;line-height:1.42;font-weight:800}
.doc{padding:36px 40px;font-family:Menlo,monospace;font-size:38px;line-height:1.5}
.doc mark{background:transparent;color:inherit;padding:2px 6px;border-radius:6px;font-weight:800}
.wire{position:absolute;top:640px;width:300px;height:500px;border:5px solid var(--ink);border-radius:26px;background:#fff;box-shadow:8px 8px 0 var(--ink);overflow:hidden}
.wire u{position:absolute;display:block;background:#D8D2C4;text-decoration:none}
.wire s{position:absolute;display:block;background:var(--ink);text-decoration:none}
.wl{position:absolute;top:1160px;width:300px;text-align:center;font-size:52px;font-weight:900}
table.rank{width:100%;border-collapse:collapse;font-size:56px;font-weight:800}
table.rank td{padding:30px 34px;border-top:4px solid var(--ink)}
table.rank td:first-child{font-family:"Smiley Sans";font-size:72px;width:120px;text-align:center;background:var(--yellow)}
.sign{position:absolute;left:0;right:0;margin:0 auto;width:fit-content;top:1250px;background:var(--ink);color:#fff;border-radius:26px;padding:24px 50px;font-size:58px;font-weight:900;white-space:nowrap}
.sign span{color:var(--yellow)}
#world{position:absolute;inset:0;transform-origin:50% 42%}
#cut{position:absolute;overflow:hidden;z-index:5;pointer-events:none}
#cut img{position:absolute;display:block;max-width:none}
#front{position:absolute;inset:0;z-index:6}
.fl{position:absolute;inset:0;visibility:hidden}
#wipe{position:absolute;inset:0;z-index:8;background:#17181A;visibility:hidden}
#flash{position:absolute;inset:0;z-index:8;background:var(--yellow);visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0}
#fnum{font-size:640px;line-height:.95;color:var(--ink)}
#fname{font-size:120px;font-weight:900;color:var(--ink);margin-top:10px}
#sub{z-index:9}#chapter{z-index:9}
.huge{position:absolute;left:0;right:0;text-align:center;color:var(--yellow);text-shadow:0 8px 0 rgba(0,0,0,.28)}
.huge em{font-style:normal;color:#fff}
</style></head><body>
<div id="world"><div id="bg"></div><div id="stage"></div><div id="person"><img id="pimg"></div><div id="cut"><img id="cimg"></div><div id="front"></div></div><div id="wipe"></div><div id="flash"><div id="fnum" class="big"></div><div id="fname"></div></div><div id="chapter"></div><div id="sub"></div>
<script src="data.js"></script><script src="SKILL_TEMPLATE/core.js"></script><script src="scenes.js"></script><script src="SKILL_TEMPLATE/engine.js"></script></body></html>
