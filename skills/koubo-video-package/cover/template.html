<!doctype html><html><head><meta charset="utf-8"><title>cover</title><style>
*{box-sizing:border-box;margin:0}
html,body{width:1080px;height:1440px;overflow:hidden}
body{position:relative;background:#fff6bb;font-family:"Source Han Sans",sans-serif;color:#111}
.glow{position:absolute;inset:0;background:radial-gradient(circle at 70% 66%,#fffdf0 0,rgba(255,253,240,0) 52%)}
.kicker{position:absolute;left:58px;top:58px;font-size:46px;font-weight:800;letter-spacing:1px;color:#111}
.line1{position:absolute;left:50px;right:30px;top:124px;font-weight:900;font-size:__SIZE1__px;line-height:1;letter-spacing:-5px;color:#111;white-space:nowrap}
.line2{position:absolute;left:44px;right:20px;top:__TOP2__px;font-weight:900;font-size:__SIZE2__px;line-height:1;letter-spacing:-8px;color:#ff0808;white-space:nowrap}
.sub{position:absolute;left:58px;top:__TOPSUB__px;font-size:50px;font-weight:800;color:#111;z-index:1}
.person{position:absolute;right:__PRIGHT__px;bottom:-40px;height:__PHEIGHT__px;z-index:4;filter:drop-shadow(0 26px 44px rgba(120,84,0,.28))}
.screen{position:absolute;left:36px;bottom:44px;width:480px;height:470px;border-radius:30px;z-index:5;overflow:hidden;transform:perspective(1400px) rotateY(14deg) rotateZ(-2deg);box-shadow:0 40px 70px rgba(116,80,0,.34),0 6px 16px rgba(116,80,0,.22);background:#fff}
.screen img{display:block;width:100%;height:100%;object-fit:cover;object-position:left top}
</style></head><body><div class="glow"></div>
<div class="kicker">__KICKER__</div><div class="line1">__LINE1__</div><div class="line2">__LINE2__</div><div class="sub">__SUB__</div>
<div class="screen"><img src="__SCREEN__"></div><img class="person" src="__PERSON__">
</body></html>
