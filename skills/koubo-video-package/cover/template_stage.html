<!doctype html><html><head><meta charset="utf-8"><title>cover</title><style>
*{box-sizing:border-box;margin:0}
html,body{width:1080px;height:1440px;overflow:hidden}
body{position:relative;background:#fff6bb;font-family:"Source Han Sans",sans-serif;color:#111}
.glow{position:absolute;inset:0;background:radial-gradient(circle at 50% 38%,#fffef2 0,rgba(255,254,242,0) 46%)}
.kicker{position:absolute;left:0;right:0;top:26px;text-align:center;font-size:50px;font-weight:900;color:#111;letter-spacing:1px}
.title{position:absolute;left:0;right:0;top:92px;text-align:center;font-weight:900;font-size:__TSIZE__px;line-height:1;letter-spacing:-8px;color:#ff0808;white-space:nowrap;z-index:1}
.person{position:absolute;left:50%;top:__PTOP__px;height:__PHEIGHT__px;transform:translateX(-50%);z-index:3;filter:drop-shadow(0 22px 36px rgba(120,84,0,.28));-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 11%)}
.pill{position:absolute;z-index:5;background:rgba(255,255,255,.86);border-radius:26px;padding:14px 28px;font-size:46px;font-weight:900;color:#111;box-shadow:0 18px 36px rgba(116,80,0,.24),0 3px 8px rgba(116,80,0,.16)}
.pill i{font-style:normal;color:#ff0808;margin-right:10px}
.panel{position:absolute;left:30px;right:30px;bottom:-30px;height:__PANELH__px;z-index:4;background:#fffdf2;border-radius:36px 36px 0 0;box-shadow:0 -22px 60px rgba(116,80,0,.3);padding:26px 26px 0;transform:perspective(1800px) rotateX(7deg);transform-origin:50% 100%}
.bar{display:flex;align-items:center;gap:12px;margin-bottom:16px;height:40px}
.bar b{font-size:34px;font-weight:900;color:#111;margin-right:auto}
.bar u{width:18px;height:18px;border-radius:50%;background:#ff0808;text-decoration:none}.bar u+u{background:#111}.bar u+u+u{background:#d9d2a8}
.rule{height:26px;margin:0 0 10px 106px;background-image:linear-gradient(90deg,#b8b294 2px,transparent 2px);background-size:66px 100%}
.track{display:flex;align-items:center;height:78px;margin-bottom:14px;gap:10px}
.track label{width:96px;flex:none;font-size:30px;font-weight:900;color:#111}
.line{flex:1;display:flex;gap:8px;height:100%;overflow:hidden}
.clip{height:100%;border-radius:12px;background:#fff0a0;color:#111;font-size:26px;font-weight:800;display:flex;align-items:center;padding:0 14px;white-space:nowrap;overflow:hidden;flex:none}
.clip.r{background:#ff0808;color:#fff}.clip.k{background:#111;color:#fff}
.wave{flex:1;height:100%;border-radius:12px;background:repeating-linear-gradient(90deg,#111 0 4px,transparent 4px 9px);-webkit-mask:linear-gradient(90deg,#0000,#000 3%,#000 97%,#0000),radial-gradient(ellipse at center,#000 40%,#0004 100%);-webkit-mask-composite:source-in}
.thumbs{flex:1;height:100%;border-radius:12px;background:url(__STRIP__) left center/auto 100% repeat-x}
.head{position:absolute;left:70.5%;top:__HEADTOP__px;bottom:0;width:6px;background:#ff0808;z-index:2}
.head:before{content:"";position:absolute;left:-13px;top:-6px;width:32px;height:24px;background:#ff0808;border-radius:6px 6px 16px 16px}
.win{position:absolute;z-index:2;border-radius:28px;overflow:hidden;background:#fff;box-shadow:0 30px 60px rgba(116,80,0,.34),0 5px 14px rgba(116,80,0,.2)}
.win img{display:block;width:100%;height:100%;object-fit:cover;object-position:left top}
.win.l{left:-46px;top:318px;width:470px;height:430px;transform:perspective(1300px) rotateY(24deg) rotateZ(-4deg)}
.win.r{right:-46px;top:330px;width:470px;height:450px;transform:perspective(1300px) rotateY(-24deg) rotateZ(4deg)}
</style></head><body><div class="glow"></div>
<div class="kicker">__KICKER__</div><div class="title">__TITLE__</div>
<div class="win l"><img src="win_left.jpg"></div><div class="win r"><img src="win_right.jpg"></div><img class="person" src="person.png">
__PILLS__
<div class="panel"><div class="bar"><u></u><u></u><u></u><b style="margin-left:16px">__PANELTITLE__</b></div><div class="rule"></div>
__TRACKS__
<div class="track"><label>音乐</label><div class="line"><div class="wave"></div></div></div>
<div class="track" style="height:128px"><label>口播</label><div class="line"><div class="thumbs"></div></div></div>
<div class="head"></div></div>
</body></html>
